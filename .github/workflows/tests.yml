name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['state/**', '**.md']
  pull_request:
    paths-ignore: ['state/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff==0.15.0
      - run: python -m ruff check src scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Validate missing-credential startup
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'src.main', '--check-setup'], env={k:v for k,v in os.environ.items() if not k.startswith('GDRIVE_')}, capture_output=True, text=True)
          assert result.returncode == 2, result.stdout
          assert 'Missing repository secrets:' in result.stdout
          assert 'Traceback' not in result.stderr
          print(result.stdout)
          assert json.load(open('run-summary.json'))['status'] == 'setup_required'
          PY
  final-runtime-proof:
    # One-time build acceptance; removed after checking the shared installer on a real runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/setup_youtube_runtime.sh
      - name: Verify the final shared runtime downloads and decodes real media
        env:
          YTDLP_PROXY: http://127.0.0.1:40000
          YTDLP_EXTRACTOR_ARGS: 'youtube:player_client=mweb;fetch_pot=always;pot_trace=true'
        run: python -m scripts.youtube_proof
