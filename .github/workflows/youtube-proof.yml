name: YouTube download proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YTDRIVE_EGRESS: ${{ secrets.YTDLP_PROXY && 'custom' || vars.YTDLP_EGRESS || 'warp' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install and verify the same runtime as the archive
        env:
          YTDLP_VERSION: ${{ vars.YTDLP_VERSION }}
        run: bash scripts/setup_youtube_runtime.sh
      - name: Download, merge, and fully decode one short public video
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY || (env.YTDRIVE_EGRESS == 'warp' && 'http://127.0.0.1:40000') || '' }}
          YTDLP_EXTRACTOR_ARGS: ${{ secrets.YTDLP_EXTRACTOR_ARGS || 'youtube:player_client=mweb;fetch_pot=always;pot_trace=true' }}
        run: python -m scripts.youtube_proof
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: youtube-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trial }}
          path: youtube-proof.json
          if-no-files-found: warn
          retention-days: 14
