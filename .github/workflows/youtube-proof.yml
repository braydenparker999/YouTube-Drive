name: YouTube download proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/youtube-proof-run.json']
permissions:
  contents: read
concurrency:
  group: youtube-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the same media runtime as the archive
        env:
          YTDLP_VERSION: '2026.9.27.232945.dev0'
        run: |
          python -m pip install -r requirements.txt
          npm install --global deno@2.9.6
          python scripts/install_ytdlp.py
          ffmpeg -version | head -n 1
      - name: Install the browser token provider
        run: python -m pip install yt-dlp-getpot-wpc==1.1.2
      - name: Check browser startup without network requests
        run: xvfb-run -a python -m scripts.check_browser
      - name: Download and fully decode one short public video
        env:
          YTDLP_IP_FAMILY: auto # WPC cannot accept a forced source address.
          YTDLP_EXTRACTOR_ARGS: 'youtube:player_client=mweb;fetch_pot=always;pot_trace=true'
        run: xvfb-run -a python -m scripts.youtube_proof
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: youtube-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: youtube-proof.json
          retention-days: 7
