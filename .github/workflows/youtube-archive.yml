name: YouTube → Drive archive
run-name: Archive ${{ inputs.request_id || github.event_name }}

on:
  schedule:
    - cron: '23 8 * * *' # 05:23 Buenos Aires (UTC-3), daily; GitHub may delay schedules.
  workflow_dispatch:
    inputs:
      urls:
        description: 'YouTube URLs: whitespace/newline-separated or a JSON array; blank checks creators'
        type: string
        required: false
        default: ''
      destination:
        description: 'Single folder name under archive root (manual requests only)'
        type: string
        default: Requested
      max_quality:
        description: 'Maximum video height (manual requests only)'
        type: choice
        options: ['360', '480', '720', '1080', '1440', '2160']
        default: '1080'
      request_id:
        description: 'Optional correlation ID for future Jarvis integration'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: youtube-archive
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YTDRIVE_EGRESS: ${{ secrets.YTDLP_PROXY && 'custom' || vars.YTDLP_EGRESS || 'warp' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check setup before installing video tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_BRANCH: ${{ github.event.repository.default_branch }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          INPUT_URLS: ${{ inputs.urls }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_MAX_QUALITY: ${{ inputs.max_quality }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: python -m src.main --check-setup
      - name: Install and verify the tested YouTube runtime
        env:
          YTDLP_VERSION: ${{ vars.YTDLP_VERSION }}
        run: bash scripts/setup_youtube_runtime.sh
      - name: Discover, download, upload, checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_BRANCH: ${{ github.event.repository.default_branch }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY || (env.YTDRIVE_EGRESS == 'warp' && 'http://127.0.0.1:40000') || '' }}
          YTDLP_EXTRACTOR_ARGS: ${{ secrets.YTDLP_EXTRACTOR_ARGS || 'youtube:player_client=mweb;fetch_pot=always' }}
          INPUT_URLS: ${{ inputs.urls }}
          INPUT_DESTINATION: ${{ inputs.destination }}
          INPUT_MAX_QUALITY: ${{ inputs.max_quality }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: python -m src.main
      - name: Save machine-readable result (never media, sessions, or raw yt-dlp metadata)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-summary.json
          if-no-files-found: warn
          retention-days: 14
